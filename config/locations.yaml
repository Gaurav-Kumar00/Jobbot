# Location vocabulary used to normalise free-text job locations.
# Matching is case-insensitive on word boundaries; longer aliases win
# ("greater noida" before "noida", "new delhi" before "delhi").

# canonical city -> aliases (all Indian)
cities:
  bengaluru: [bengaluru, bangalore, blr, bengaluru urban, bangalore urban, electronic city, whitefield]
  delhi: [delhi, new delhi]
  gurugram: [gurugram, gurgaon]
  noida: [noida]
  greater_noida: [greater noida]
  ghaziabad: [ghaziabad]
  faridabad: [faridabad]
  hyderabad: [hyderabad, secunderabad, hitech city, hitec city, gachibowli]
  pune: [pune]
  mumbai: [mumbai, bombay, navi mumbai, thane]
  chennai: [chennai, madras]
  kolkata: [kolkata, calcutta]
  ahmedabad: [ahmedabad, gandhinagar]
  jaipur: [jaipur]
  kochi: [kochi, cochin]
  thiruvananthapuram: [thiruvananthapuram, trivandrum]
  coimbatore: [coimbatore]
  chandigarh: [chandigarh, mohali, panchkula]
  indore: [indore]
  bhopal: [bhopal]
  nagpur: [nagpur]
  lucknow: [lucknow]
  vadodara: [vadodara, baroda]
  mysuru: [mysuru, mysore]
  bhubaneswar: [bhubaneswar]
  visakhapatnam: [visakhapatnam, vizag]

# regions group cities; preferences may name a region or a city
regions:
  ncr: [delhi, gurugram, noida, greater_noida, ghaziabad, faridabad]

# text that names a region directly
region_aliases:
  ncr: [delhi ncr, ncr, national capital region]

# Indian states / UTs -> imply country IN

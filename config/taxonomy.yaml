# Skill vocabulary: canonical skill -> aliases found in job text.
# Matching is case-insensitive with non-alphanumeric boundaries, so aliases
# like "c++", "node.js" and "ci/cd" work. Avoid aliases that are common English
# words ("rest", "go", "spring" alone) — they produce false positives.

